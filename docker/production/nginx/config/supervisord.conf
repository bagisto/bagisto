[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

# The bundled database runs as its own program, dropped in by the Dockerfile
# from shared/db/<engine>/supervisord.conf.

# --------------------------------------------------------------------------
# PHP-FPM
# --------------------------------------------------------------------------
[program:php-fpm]
command=/usr/sbin/php-fpm__PHP_VERSION__ -F --fpm-config /etc/php/__PHP_VERSION__/fpm/php-fpm.conf
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# --------------------------------------------------------------------------
# Nginx
# --------------------------------------------------------------------------
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# --------------------------------------------------------------------------
# Queue worker
# --------------------------------------------------------------------------
# `broadcastable` is the queue the notification events name, `default` the rest.
# `--timeout` stays below the connection's `retry_after` (90) so no job runs twice.
[program:queue]
command=php artisan queue:work --queue=default,broadcastable --tries=3 --timeout=60 --sleep=3 --max-time=3600
directory=/var/www/bagisto
user=www-data
autostart=true
autorestart=true
priority=20
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
