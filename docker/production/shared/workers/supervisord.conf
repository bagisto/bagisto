# The background workers every image runs, whichever web server it carries. The
# Dockerfile drops this in as /etc/supervisor/conf.d/workers.conf.

# --------------------------------------------------------------------------
# Queue worker
# --------------------------------------------------------------------------
# `broadcastable` is the queue the notification events name, `default` the rest.
# `--timeout` stays below the connection's `retry_after` (90) so no job runs twice.
[program:queue]
command=php artisan queue:work --queue=default,broadcastable --tries=3 --timeout=60 --sleep=3 --max-time=3600
directory=/var/www/bagisto
user=www-data
autostart=true
autorestart=true
priority=20
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# --------------------------------------------------------------------------
# Scheduler
# --------------------------------------------------------------------------
# cron runs `php artisan schedule:run` every minute, from /etc/cron.d/bagisto.
# SCHEDULER_AUTOSTART=false leaves it stopped, for every container but one
# when several share a database.
[program:scheduler]
command=/usr/sbin/cron -f
autostart=%(ENV_SCHEDULER_AUTOSTART)s
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
