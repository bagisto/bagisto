# The background workers every image runs, whichever web server it carries. The
# Dockerfile drops this in as /etc/supervisor/conf.d/workers.conf.

# --------------------------------------------------------------------------
# Scheduler
# --------------------------------------------------------------------------
# cron runs `php artisan schedule:run` every minute, from /etc/cron.d/bagisto.
# SCHEDULER_AUTOSTART=false leaves it stopped, for every container but one
# when several share a database.
[program:scheduler]
command=/usr/sbin/cron -f
autostart=%(ENV_SCHEDULER_AUTOSTART)s
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
