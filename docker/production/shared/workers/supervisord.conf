# The background workers every image runs, whichever web server it carries. The
# Dockerfile drops this in as /etc/supervisor/conf.d/workers.conf.

# ---------------------------------------------------------------------------
# Queue Worker
#
# The `broadcastable` queue is the one the notification events name, and
# `default` takes the rest. Its `--timeout` stays below the connection's
# `retry_after` (90), so no job runs twice. The output is filed by day under
# /var/log/bagisto/queue/ and still reaches `docker logs`. Bash execs into
# PHP, so Supervisor's stop signal reaches the worker itself and the job in
# hand finishes.
# ---------------------------------------------------------------------------
[program:queue]
command=/bin/bash -c "exec php artisan queue:work --queue=default,broadcastable --tries=3 --timeout=60 --sleep=3 --max-time=3600 > >(exec /usr/local/bin/bagisto-job-log queue) 2>&1"
directory=/var/www/bagisto
user=www-data
autostart=true
autorestart=true
priority=20
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ---------------------------------------------------------------------------
# Scheduler
#
# Cron runs `php artisan schedule:run` every minute, from /etc/cron.d/bagisto.
# SCHEDULER_AUTOSTART=false leaves it stopped, for every container but one
# when several share a database.
# ---------------------------------------------------------------------------
[program:scheduler]
command=/usr/sbin/cron -f
autostart=%(ENV_SCHEDULER_AUTOSTART)s
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
