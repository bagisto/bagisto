# ---------------------------------------------------------------------------
# MySQL
#
# The database bundled in the image, started only when the container uses
# it. Pointing DB_HOST at an external server sets DB_AUTOSTART=false, and
# this program stays down.
# ---------------------------------------------------------------------------
[program:mysql]
command=/usr/sbin/mysqld --user=mysql --datadir=/var/lib/mysql
autostart=%(ENV_DB_AUTOSTART)s
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
