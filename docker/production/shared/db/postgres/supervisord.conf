# --------------------------------------------------------------------------
# PostgreSQL — the database bundled in the image.
#
# Started only when the container is using it. Pointing DB_HOST at an external
# server sets DB_AUTOSTART=false, and this program stays down.
#
# The server is launched through a wrapper rather than directly, because the
# cluster version is part of the binary's path and is discovered at runtime.
# --------------------------------------------------------------------------
[program:postgresql]
command=/usr/local/bin/postgres-server.sh
user=postgres
autostart=%(ENV_DB_AUTOSTART)s
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
