<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/bagisto/public

    # --- Real-Time Notifications ---
    # Reverb runs inside the container on 127.0.0.1:8080. Websocket upgrades on
    # /app/ and the events Laravel publishes to /apps/<id>/ reach it; any other
    # request there, such as a nested category page, reaches the application.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/app/(.*)$ ws://127.0.0.1:8080/app/$1 [P,L]
    RewriteCond %{REQUEST_METHOD} =POST
    RewriteRule ^/apps/([^/]+)/(events|batch_events)$ http://127.0.0.1:8080/apps/$1/$2 [P,L]

    <Directory /var/www/bagisto/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        DirectoryIndex index.php

        RewriteEngine On

        # --- Deny Dotfiles ---
        # Dot directories are denied too, except .well-known.
        RewriteRule "(^|/)\.(?!well-known)" - [F]

        # --- Laravel Front Controller ---
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>

    # --- Long-Lived Cache for Static Assets ---
    <FilesMatch "\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>

    # --- Security Headers ---
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # --- Upload and Body Size ---
    LimitRequestBody 104857600

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
