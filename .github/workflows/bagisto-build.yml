name: Build Bagisto 2.5.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Install Dependencies and Package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.27'
          extensions: bcmath,ctype,curl,dom,fileinfo,gd,intl,mbstring,openssl,pdo,pdo_pgsql,tokenizer,xml,zip
          tools: composer:v2
          coverage: none

      - name: Verify PHP Environment
        run: |
          php -v
          php -m
          php -r "if (!extension_loaded('pdo_pgsql')) { exit(1); }"

      - name: Install PHP Dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Node.js Dependencies
        run: |
          if [ ! -f package.json ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            echo "No npm lock file found; using npm install."
            npm install
          fi

      - name: Build Frontend Assets
        run: npm run build

      - name: Verify Build Output
        run: |
          test -d vendor
          test -d node_modules
          test -f artisan
          test -f composer.json

          echo "PHP dependencies:"
          du -sh vendor

          echo "Node.js dependencies:"
          du -sh node_modules

          if [ -d public/build ]; then
            echo "Frontend build output:"
            du -sh public/build
          else
            echo "WARNING: public/build not found."
            echo "Verify the actual frontend build output directory."
          fi

      - name: Package Bagisto
        run: |
          tar -czf bagisto-build.tar.gz \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./storage/logs/*' \
            --exclude='./storage/framework/cache/data/*' \
            --exclude='./storage/framework/sessions/*' \
            --exclude='./storage/framework/views/*' \
            --exclude='./bootstrap/cache/*.php' \
            --exclude='./bagisto-build.tar.gz' \
            .

          echo "Package size:"
          du -h bagisto-build.tar.gz

          echo "Verify package contents:"
          tar -tzf bagisto-build.tar.gz | grep -m 1 '^./vendor/'
          tar -tzf bagisto-build.tar.gz | grep -m 1 '^./node_modules/'

      - name: Upload Deployment Package
        uses: actions/upload-artifact@v4
        with:
          name: bagisto-2.5.0-php-8.4.27-postgresql
          path: bagisto-build.tar.gz
          if-no-files-found: error
          retention-days: 7
