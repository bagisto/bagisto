name: Build & Publish Docker Image

# ============================================================================
# Triggers a multi-arch (amd64 + arm64) build of the production Bagisto images
# whenever a `v*` tag is pushed (the same tag convention used for Bagisto
# releases), and also supports manual dispatch for ad-hoc rebuilds.
#
# Images are built from docker/production/ across two dimensions — the web
# server and the bundled database — giving :<version>-<server>-<database>:
#
#   servers   : nginx, apache, litespeed
#   databases : mysql, mariadb, postgres
#
# e.g. 2.5.0-nginx-mysql, 2.5.0-nginx-mariadb, 2.5.0-apache-postgres
#
# Shorter aliases point at the conventional choice, so existing pulls keep
# working:
#
#   :<version>-<server>  → that server on MySQL
#   :<version>           → nginx on MySQL
#   :latest              → the newest stable :<version>
#
# The variants build in parallel and are pushed by digest (untagged); a final
# job then creates every human-readable tag sequentially, in reverse of the
# order they should appear. Docker Hub lists tags newest-pushed first, so this
# gives a stable, readable ordering on the repository page:
#
#   latest, latest-nginx, latest-litespeed, latest-apache,
#   latest-nginx-mysql, latest-litespeed-mysql, latest-apache-mysql,
#   latest-nginx-mariadb, latest-litespeed-mariadb, latest-apache-mariadb,
#   latest-nginx-postgres, latest-litespeed-postgres, latest-apache-postgres,
#   then the matching <version> tags.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  Docker Hub user / org with push access to webkul/bagisto
#   DOCKERHUB_TOKEN     Docker Hub access token (NOT a password)
# ============================================================================

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bagisto_version:
        description: 'Bagisto git tag to build (e.g. v2.4.7). Defaults to the workflow ref tag.'
        required: false
        type: string

env:
  IMAGE_NAME: webkul/bagisto
  BUILD_CONTEXT: docker/production

jobs:
  # --------------------------------------------------------------------------
  # Resolve the version + tagging decisions once, then fan out to the variants.
  # --------------------------------------------------------------------------
  resolve:
    name: Resolve Version & Tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bagisto_version: ${{ steps.version.outputs.bagisto_version }}
      docker_tag: ${{ steps.version.outputs.docker_tag }}
      push_latest: ${{ steps.version.outputs.push_latest }}
      default_branch: ${{ steps.version.outputs.default_branch }}
      on_default_branch: ${{ steps.version.outputs.on_default_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve Bagisto Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Prefer manual input; otherwise derive from the tag that triggered the run.
          if [ -n "${{ inputs.bagisto_version }}" ]; then
            BAGISTO_VERSION="${{ inputs.bagisto_version }}"
          else
            BAGISTO_VERSION="${GITHUB_REF#refs/tags/}"
          fi

          # Sanity check the format: must look like vX.Y.Z[-suffix].
          if ! echo "$BAGISTO_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "::error::BAGISTO_VERSION '$BAGISTO_VERSION' is not a valid semver tag (expected vX.Y.Z or vX.Y.Z-suffix)"
            exit 1
          fi

          # Docker tag = git tag without the leading 'v'.
          DOCKER_TAG="${BAGISTO_VERSION#v}"

          # Pre-release if the tag has any -suffix.
          IS_PRERELEASE="false"
          if echo "$BAGISTO_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-'; then
            IS_PRERELEASE="true"
          fi

          # Is the build commit on (or behind) the default branch?
          # We use the GitHub compare API: status of `default...build_sha` will be
          #   identical  → same commit as default tip
          #   behind     → build commit is older but on the default branch line
          #   ahead      → build commit has commits the default doesn't (unusual for releases)
          #   diverged   → build commit is on a side branch (e.g. 2.3 while default is 2.4)
          # Only `identical` and `behind` mean "this release belongs to the active line".
          BUILD_SHA="${{ github.sha }}"
          COMPARE_STATUS=$(gh api "repos/${{ github.repository }}/compare/${DEFAULT_BRANCH}...${BUILD_SHA}" --jq '.status' 2>/dev/null || echo "unknown")

          ON_DEFAULT_BRANCH="false"
          case "$COMPARE_STATUS" in
            identical|behind) ON_DEFAULT_BRANCH="true" ;;
          esac

          # :latest — only stable releases on the default branch line.
          PUSH_LATEST="false"
          if [ "$IS_PRERELEASE" = "false" ] && [ "$ON_DEFAULT_BRANCH" = "true" ]; then
            PUSH_LATEST="true"
          fi

          echo "bagisto_version=$BAGISTO_VERSION"     >> "$GITHUB_OUTPUT"
          echo "docker_tag=$DOCKER_TAG"               >> "$GITHUB_OUTPUT"
          echo "push_latest=$PUSH_LATEST"             >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE"         >> "$GITHUB_OUTPUT"
          echo "on_default_branch=$ON_DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "default_branch=$DEFAULT_BRANCH"       >> "$GITHUB_OUTPUT"

          echo "Resolved BAGISTO_VERSION=$BAGISTO_VERSION"
          echo "Default branch: $DEFAULT_BRANCH (build commit status: $COMPARE_STATUS)"
          echo "On default branch line: $ON_DEFAULT_BRANCH"
          echo "Docker tag: $DOCKER_TAG (latest=$PUSH_LATEST, prerelease=$IS_PRERELEASE)"

  # --------------------------------------------------------------------------
  # Build each web-server × database variant in parallel and push it by digest
  # (untagged). The human-readable tags are applied later, in order, by the
  # `publish` job.
  # --------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.variant }}-${{ matrix.database }} (amd64 + arm64)
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [nginx, apache, litespeed]
        database: [mysql, mariadb, postgres]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log In to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push by Digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.BUILD_CONTEXT }}/${{ matrix.variant }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BAGISTO_VERSION=${{ needs.resolve.outputs.bagisto_version }}
            DB_ENGINE=${{ matrix.database }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.database }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.database }}
          labels: |
            org.opencontainers.image.title=Bagisto (${{ matrix.variant }} + ${{ matrix.database }})
            org.opencontainers.image.description=Bagisto production image (${{ matrix.variant }} + PHP 8.4 + ${{ matrix.database }}, fully installed)
            org.opencontainers.image.version=${{ needs.resolve.outputs.docker_tag }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Export Digest
        run: |
          mkdir -p /tmp/digests
          echo -n "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.variant }}-${{ matrix.database }}"

      - name: Upload Digest
        uses: actions/upload-artifact@v6
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.database }}
          path: /tmp/digests/${{ matrix.variant }}-${{ matrix.database }}
          if-no-files-found: error
          retention-days: 1

  # --------------------------------------------------------------------------
  # Apply the human-readable tags in a fixed order. Docker Hub lists tags by
  # most-recently-pushed first, so tags are created bottom-up: the version tags
  # first, then the `latest` aliases, ending with `:latest` — which then sits at
  # the top of the repository page.
  # --------------------------------------------------------------------------
  publish:
    name: Tag & Publish (Ordered)
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log In to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download Digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Create Tags In Order
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          DOCKER_TAG: ${{ needs.resolve.outputs.docker_tag }}
          PUSH_LATEST: ${{ needs.resolve.outputs.push_latest }}
        run: |
          set -euo pipefail

          # create <tag> <combo> — point IMAGE:<tag> at the digest built for <combo>.
          create() {
            local digest
            digest=$(cat "/tmp/digests/$2")
            echo "→ ${IMAGE}:$1  (from $2 @ ${digest})"
            docker buildx imagetools create -t "${IMAGE}:$1" "${IMAGE}@${digest}"
          }

          # Version tags — created first so they sort below the `latest` block.
          # Order here is the reverse of how they should read on Docker Hub.
          create "${DOCKER_TAG}-apache-postgres"    apache-postgres
          create "${DOCKER_TAG}-litespeed-postgres" litespeed-postgres
          create "${DOCKER_TAG}-nginx-postgres"     nginx-postgres
          create "${DOCKER_TAG}-apache-mariadb"     apache-mariadb
          create "${DOCKER_TAG}-litespeed-mariadb"  litespeed-mariadb
          create "${DOCKER_TAG}-nginx-mariadb"      nginx-mariadb
          create "${DOCKER_TAG}-apache-mysql"       apache-mysql
          create "${DOCKER_TAG}-litespeed-mysql"    litespeed-mysql
          create "${DOCKER_TAG}-nginx-mysql"        nginx-mysql
          create "${DOCKER_TAG}-apache"             apache-mysql
          create "${DOCKER_TAG}-litespeed"          litespeed-mysql
          create "${DOCKER_TAG}-nginx"              nginx-mysql
          create "${DOCKER_TAG}"                    nginx-mysql

          # Latest aliases — only for a stable release on the default branch line.
          # Created last, ending with `:latest`, so the block sorts to the top.
          if [ "${PUSH_LATEST}" = "true" ]; then
            create "latest-apache-postgres"    apache-postgres
            create "latest-litespeed-postgres" litespeed-postgres
            create "latest-nginx-postgres"     nginx-postgres
            create "latest-apache-mariadb"     apache-mariadb
            create "latest-litespeed-mariadb"  litespeed-mariadb
            create "latest-nginx-mariadb"      nginx-mariadb
            create "latest-apache-mysql"       apache-mysql
            create "latest-litespeed-mysql"    litespeed-mysql
            create "latest-nginx-mysql"        nginx-mysql
            create "latest-apache"             apache-mysql
            create "latest-litespeed"          litespeed-mysql
            create "latest-nginx"              nginx-mysql
            create "latest"                    nginx-mysql
          fi

      - name: Summary
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          DOCKER_TAG: ${{ needs.resolve.outputs.docker_tag }}
          PUSH_LATEST: ${{ needs.resolve.outputs.push_latest }}
        run: |
          {
            echo "### Published \`${IMAGE}\` (${DOCKER_TAG})"
            echo ""
            echo "Tags were created in a fixed order so the Docker Hub listing reads:"
            echo ""
            if [ "${PUSH_LATEST}" = "true" ]; then
              echo '- `latest`, `latest-nginx`, `latest-litespeed`, `latest-apache`'
              echo '- `latest-nginx-mysql`, `latest-litespeed-mysql`, `latest-apache-mysql`'
              echo '- `latest-nginx-mariadb`, `latest-litespeed-mariadb`, `latest-apache-mariadb`'
              echo '- `latest-nginx-postgres`, `latest-litespeed-postgres`, `latest-apache-postgres`'
            fi
            echo "- then the matching \`${DOCKER_TAG}\` tags."
            echo ""
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"
