  sonar:
    if: github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lay du lich su sonar qube?

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  publish:
    needs: [build, lint, test, sonar]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on:  ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: 
        name: [app, web]
    steps:
      - uses: actions/checkout@v4
        with:
          name: immage-${{matrix.name}}
          path: /tmp
      - name: Nap image da build
        run : gunzip -c "/tmp/${{matrix.name}}.tar.gz" | docker load
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Gan tag theo commit va push
        run : |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="ghcr.io/${OWNER}/bagisto-${{matrix.name}}"
          TAG="sha-${GITHUB_SHA::7}"
          docker tag "bagisto-${{matrix.name}}:ci" "${REPO}:${TAG}"
          docker push "${REPO}:${TAG}"
          echo "da push image ${REPO}:${TAG}"
          docker inspect --format='{{index .RepoDigests 0}}' "${REPO}:${TAG}""

        
      







          


        

