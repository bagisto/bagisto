---
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# Push liên tiếp lên cùng nhánh thì huỷ lần chạy cũ
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            file: Dockerfile
          - name: web
            file: Dockerfile.nginx
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build đúng một lần, nạp vào Docker local của runner để smoke test.
      # Chưa push đi đâu (phần publish làm ở lớp sau).
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          load: true
          tags: bagisto-${{ matrix.name }}:ci
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Kích thước image
        run: docker images "bagisto-${{ matrix.name }}"

      # Lần đầu CHỈ BÁO CÁO (exit-code 0) để lấy số liệu gốc, chưa chặn pipeline.
      # Sau khi xem kết quả mới đặt ngưỡng (đổi exit-code thành 1).
      - name: Trivy báo cáo image (CRITICAL và HIGH, không chặn)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bagisto-${{ matrix.name }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          format: table
          exit-code: '0'

      # CỔNG CHẶN (đang để lỏng): chỉ CRITICAL và đã có bản vá thì mới làm pipeline đỏ.
      # Muốn bỏ qua một CVE có lý do: thêm vào file .trivyignore ở gốc repo (kèm ghi chú).
      # Siết dần sau này: thêm HIGH vào severity.
      - name: Trivy cổng chặn image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bagisto-${{ matrix.name }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          format: table
          exit-code: '1'

      # --entrypoint để chỉ chạy đúng lệnh kiểm tra, không chạy script khởi động của image
      - name: Smoke test (app)
        if: matrix.name == 'app'
        run: |
          IMG=bagisto-app:ci
          echo "1) không chạy bằng root"
          test "$(docker run --rm --entrypoint id $IMG -u)" != "0"

          echo "2) extension bắt buộc"
          mods="$(docker run --rm --entrypoint php $IMG -m)"
          for e in calendar intl pdo_mysql gd zip bcmath; do
            echo "$mods" | grep -qix "$e" || { echo "THIẾU extension: $e"; exit 1; }
          done

          echo "3) vendor đã có"
          docker run --rm --entrypoint test $IMG -f vendor/autoload.php

          echo "4) công cụ build không nằm trong image cuối"
          docker run --rm --entrypoint sh $IMG -c '! command -v composer && ! command -v unzip'

      - name: Smoke test (web)
        if: matrix.name == 'web'
        run: |
          # nginx cần container app mới khởi động được, nên ở đây chỉ kiểm tra nội dung image
          docker run --rm --entrypoint ls bagisto-web:ci /var/www/html/public

      # Chỉ trên nhánh mặc định: lưu CHÍNH image vừa build/quét/test để job publish đẩy lên,
      # không build lại.
      - name: Lưu image
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        run: docker save "bagisto-${{ matrix.name }}:ci" | gzip -1 > "/tmp/${{ matrix.name }}.tar.gz"

      - name: Upload image artifact
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: /tmp/${{ matrix.name }}.tar.gz
          retention-days: 1

  scan-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # composer.lock (thư viện PHP), secret lọt vào repo, cấu hình sai trong Dockerfile/compose
      - name: Trivy quét mã nguồn
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '0'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: calendar, gd, intl, zip, bcmath
          coverage: none        # tắt Xdebug cho nhanh
          tools: composer:v2

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      # Chỉ kiểm tra, không sửa file
      - name: Pint (kiểu code)
        run: vendor/bin/pint --test

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bagisto
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: calendar, gd, intl, zip, bcmath, pdo_mysql, curl, fileinfo, mbstring, openssl, tokenizer
          ini-values: error_reporting=E_ALL
          coverage: none        # tắt Xdebug cho nhanh (bật pcov riêng khi làm Sonar)
          tools: composer:v2

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      # phpunit.xml không khai báo DB, nên DB lấy từ .env
      - name: Chuẩn bị .env cho test
        run: |
          cp .env.example .env
          sed -i "s|^\(APP_ENV=\s*\).*$|\1testing|" .env
          sed -i "s|^\(DB_HOST=\s*\).*$|\1127.0.0.1|" .env
          sed -i "s|^\(DB_PORT=\s*\).*$|\13306|" .env
          sed -i "s|^\(DB_DATABASE=\s*\).*$|\1bagisto|" .env
          sed -i "s|^\(DB_USERNAME=\s*\).*$|\1root|" .env
          sed -i "s|^\(DB_PASSWORD=\s*\).*$|\1root|" .env

      # Bagisto 2.4: các cờ --skip-* đã bị gỡ, dùng --no-interaction (đọc .env có sẵn).
      # Lệnh này XOÁ SẠCH database rồi cài mới: chỉ chạy trên DB tạm của CI.
      - name: Bagisto installer
        run: php artisan bagisto:install --no-interaction

      # Chẩn đoán: runner có bao nhiêu CPU/RAM (Pest song song chia theo số CPU)
      - name: Thông tin runner
        run: nproc && free -h

      # --profile: in ra các test chậm nhất. Nếu cờ này không chạy cùng --parallel
      # thì bỏ --parallel ở lần chẩn đoán này.
      # Nếu chạy quá nặng hoặc lỗi, thu hẹp bằng: --testsuite="Unit Test"
      - name: Pest
        run: vendor/bin/pest --testsuite="Unit Test" --parallel --colors=always --profile

  sonar:
    # SonarQube Cloud gói Free chỉ phân tích nhánh chính và Pull Request
    if: github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # lấy đủ lịch sử để Sonar xác định code mới

      # Lớp đầu: chỉ quét code, chưa chặn pipeline (không đặt sonar.qualitygate.wait).
      # Phiên bản action: nếu @v8 không tìm thấy, lấy tag đầy đủ ở trang Tags của repo
      # SonarSource/sonarqube-scan-action.
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish:
    needs: [build, scan-source, lint, test, sonar]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        name: [app, web]

    steps:
      # 1. Download Docker image artifact từ job build
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: /tmp

      # 2. Load Docker image vào Docker daemon
      - name: Load Docker image
        run: |
          gunzip -c "/tmp/${{ matrix.name }}.tar.gz" | docker load

      # 3. Login vào GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Push image lên GHCR và lấy digest
      - name: Push image to GHCR
        id: push
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="ghcr.io/${OWNER}/bagisto-${{ matrix.name }}"
          TAG="sha-${GITHUB_SHA::7}"

          # Tag image local bằng GHCR reference
          docker tag "bagisto-${{ matrix.name }}:ci" "${REPO}:${TAG}"

          # Push image
          docker push "${REPO}:${TAG}"

          # Lấy digest từ image trên GHCR
          DIGEST_REF="$(docker inspect \
            --format='{{range .RepoDigests}}{{println .}}{{end}}' \
            "${REPO}:${TAG}" | grep -F "${REPO}@" | head -n 1)"

          if [[ -z "${DIGEST_REF}" ]]; then
            echo "::error::Cannot retrieve GHCR image digest"
            exit 1
          fi

          echo "Image pushed: ${DIGEST_REF}"
          {
            echo "image=${REPO}"
            echo "tag=${TAG}"
            echo "digest_ref=${DIGEST_REF}"
          } >> "$GITHUB_OUTPUT"

      # 5. Generate SBOM bằng Trivy
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bagisto-${{ matrix.name }}:ci
          format: cyclonedx
          output: sbom-${{ matrix.name }}.cdx.json
          exit-code: "0"

      # 6. Cài đặt Cosign
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # 7. Kiểm tra image reference
      - name: Verify image reference
        env:
          DIGEST_REF: ${{ steps.push.outputs.digest_ref }}
        run: |
          echo "DIGEST_REF=${DIGEST_REF}"

          if [[ "${DIGEST_REF}" != ghcr.io/* ]]; then
            echo "::error::Image reference is not a GHCR reference"
            exit 1
          fi

      # 8. Sign image bằng Cosign keyless
      - name: Sign image
        env:
          DIGEST_REF: ${{ steps.push.outputs.digest_ref }}
        run: |
          cosign sign --yes "${DIGEST_REF}"

      # 9. Attest SBOM vào image
      - name: Attest SBOM
        env:
          DIGEST_REF: ${{ steps.push.outputs.digest_ref }}
        run: |
          cosign attest \
            --yes \
            --type cyclonedx \
            --predicate "sbom-${{ matrix.name }}.cdx.json" \
            "${DIGEST_REF}"

      # 10. Verify chữ ký image
      - name: Verify image signature
        env:
          DIGEST_REF: ${{ steps.push.outputs.digest_ref }}
        run: |
          cosign verify "${DIGEST_REF}" \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      # 11. Ghi lại image reference đã push để job update-gitops dùng, không build lại
      - name: Record published image metadata
        env:
          COMPONENT: ${{ matrix.name }}
          IMAGE: ${{ steps.push.outputs.image }}
          IMAGE_TAG: ${{ steps.push.outputs.tag }}
          DIGEST_REF: ${{ steps.push.outputs.digest_ref }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/image-ref
          jq -n \
            --arg component "${COMPONENT}" \
            --arg image "${IMAGE}" \
            --arg tag "${IMAGE_TAG}" \
            --arg digest_ref "${DIGEST_REF}" \
            '{component: $component, image: $image, tag: $tag, digest_ref: $digest_ref}' \
            > "/tmp/image-ref/${COMPONENT}.json"
          cat "/tmp/image-ref/${COMPONENT}.json"

      - name: Upload published image metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-ref-${{ matrix.name }}
          path: /tmp/image-ref/${{ matrix.name }}.json
          retention-days: 1

      # 12. Upload SBOM làm GitHub Actions artifact
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.cdx.json
          retention-days: 30

  update-gitops:
    name: update-gitops
    needs: [publish]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITOPS_REPOSITORY: ${{ vars.GITOPS_REPOSITORY }}
      GITOPS_BRANCH: ${{ vars.GITOPS_BRANCH || 'master' }}
      GITOPS_OVERLAY_DIR: ${{ vars.GITOPS_OVERLAY_DIR || 'overlays/dev' }}
      KUSTOMIZE_VERSION: v5.7.1
      KUSTOMIZE_SHA256: ea375e7372f9aa029129d4b2d16c66b7750b7f1213c4f66f910d981c895818d8

    steps:
      - name: Download published image metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-ref-*
          path: image-metadata
          merge-multiple: true

      - name: Validate configuration and image metadata
        id: images
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GITOPS_REPOSITORY:-}" ]]; then
            echo "::error::Repository variable GITOPS_REPOSITORY is not set."
            exit 1
          fi

          if [[ ! "${GITOPS_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::GITOPS_REPOSITORY must be in owner/repository form."
            exit 1
          fi

          if [[ ! "${GITOPS_BRANCH}" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "${GITOPS_BRANCH}" == -* ]]; then
            echo "::error::GITOPS_BRANCH contains unsupported characters."
            exit 1
          fi

          if [[ ! "${GITOPS_OVERLAY_DIR}" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "${GITOPS_OVERLAY_DIR}" == *".."* ]] || [[ "${GITOPS_OVERLAY_DIR}" == /* ]]; then
            echo "::error::GITOPS_OVERLAY_DIR must be a relative path inside the GitOps repository."
            exit 1
          fi

          if [[ -z "${GITOPS_TOKEN:-}" ]]; then
            echo "::error::Secret GITOPS_TOKEN is not set."
            exit 1
          fi

          for component in app web; do
            metadata="image-metadata/${component}.json"
            if [[ ! -s "${metadata}" ]]; then
              echo "::error::Missing published image metadata for component: ${component}"
              exit 1
            fi
            jq -e . "${metadata}" >/dev/null
          done

          app_tag="$(jq -er '.tag' image-metadata/app.json)"
          web_tag="$(jq -er '.tag' image-metadata/web.json)"

          if [[ ! "${app_tag}" =~ ^sha-[0-9a-f]{7}$ ]]; then
            echo "::error::app image tag is not an immutable sha-<7-hex> tag: ${app_tag}"
            exit 1
          fi

          if [[ "${app_tag}" != "${web_tag}" ]]; then
            echo "::error::app and web images were published with different tags."
            exit 1
          fi

          while IFS= read -r metadata; do
            image="$(jq -er '.image' "${metadata}")"
            digest_ref="$(jq -er '.digest_ref' "${metadata}")"
            if [[ ! "${image}" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]]; then
              echo "::error::Unexpected image repository in ${metadata}: ${image}"
              exit 1
            fi
            if [[ "${digest_ref}" != "${image}@sha256:"* ]]; then
              echo "::error::Digest reference in ${metadata} does not match its image."
              exit 1
            fi
          done < <(find image-metadata -maxdepth 1 -name '*.json' -print | sort)

          echo "tag=${app_tag}" >> "$GITHUB_OUTPUT"

      - name: Install Kustomize ${{ env.KUSTOMIZE_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}"
          curl -fsSLo kustomize.tar.gz "${base}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tar.gz" | sha256sum -c -
          tar -xzf kustomize.tar.gz kustomize
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Checkout GitOps repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          fetch-depth: 0
          persist-credentials: true

      - name: Check whether the image tags already match
        id: current
        working-directory: gitops
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "${GITOPS_OVERLAY_DIR}/kustomization.yaml" ]]; then
            echo "::error::Kustomization not found at ${GITOPS_OVERLAY_DIR}/kustomization.yaml"
            exit 1
          fi

          kustomize build "${GITOPS_OVERLAY_DIR}" > "${RUNNER_TEMP}/current.yaml"

          up_to_date=true
          while IFS= read -r metadata; do
            image="$(jq -er '.image' "${metadata}")"
            image_tag="$(jq -er '.tag' "${metadata}")"
            if ! grep -Fq "image: ${image}:${image_tag}" "${RUNNER_TEMP}/current.yaml"; then
              up_to_date=false
            fi
          done < <(find "$GITHUB_WORKSPACE/image-metadata" -maxdepth 1 -name '*.json' -print | sort)

          echo "up_to_date=${up_to_date}" >> "$GITHUB_OUTPUT"
          if [[ "${up_to_date}" == "true" ]]; then
            echo "GitOps already references ${GITOPS_REPOSITORY}@${GITOPS_BRANCH} at tag ${{ steps.images.outputs.tag }}."
          fi

      - name: Update Kustomize image tags
        if: steps.current.outputs.up_to_date != 'true'
        working-directory: gitops
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITOPS_OVERLAY_DIR}"

          image_args=()
          while IFS= read -r metadata; do
            image="$(jq -er '.image' "${metadata}")"
            image_tag="$(jq -er '.tag' "${metadata}")"
            image_args+=("${image}:${image_tag}")
          done < <(find "$GITHUB_WORKSPACE/image-metadata" -maxdepth 1 -name '*.json' -print | sort)

          kustomize edit set image "${image_args[@]}"

      - name: Validate modified Kustomize overlay
        if: steps.current.outputs.up_to_date != 'true'
        working-directory: gitops
        shell: bash
        run: |
          set -euo pipefail

          kustomize build "${GITOPS_OVERLAY_DIR}" > "${RUNNER_TEMP}/rendered.yaml"
          test -s "${RUNNER_TEMP}/rendered.yaml"

          while IFS= read -r metadata; do
            image="$(jq -er '.image' "${metadata}")"
            image_tag="$(jq -er '.tag' "${metadata}")"
            if ! grep -Fq "image: ${image}:${image_tag}" "${RUNNER_TEMP}/rendered.yaml"; then
              echo "::error::Rendered overlay does not contain ${image}:${image_tag}"
              exit 1
            fi
          done < <(find "$GITHUB_WORKSPACE/image-metadata" -maxdepth 1 -name '*.json' -print | sort)

          mapfile -t changed_files < <(git diff --name-only)
          if [[ "${#changed_files[@]}" -ne 1 ]] || [[ "${changed_files[0]}" != "${GITOPS_OVERLAY_DIR}/kustomization.yaml" ]]; then
            echo "::error::Unexpected files changed by kustomize edit:"
            printf '%s\n' "${changed_files[@]}"
            exit 1
          fi

          if git status --porcelain --untracked-files=no | grep -vq "^ M ${GITOPS_OVERLAY_DIR}/kustomization.yaml$"; then
            echo "::error::Unrelated tracked changes detected in the GitOps repository."
            git status --short
            exit 1
          fi

      - name: Commit GitOps update
        id: commit
        if: steps.current.outputs.up_to_date != 'true'
        working-directory: gitops
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No image tag change to commit."
            exit 0
          fi

          git config user.name "bagisto-ci[bot]"
          git config user.email "bagisto-ci[bot]@users.noreply.github.com"
          git add -- "${GITOPS_OVERLAY_DIR}/kustomization.yaml"
          git commit -m "chore(gitops): update bagisto image to ${{ steps.images.outputs.tag }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Fetch, rebase, and push GitOps update
        if: steps.current.outputs.up_to_date != 'true' && steps.commit.outputs.changed == 'true'
        working-directory: gitops
        shell: bash
        run: |
          set -euo pipefail

          validate_rendered() {
            kustomize build "${GITOPS_OVERLAY_DIR}" > "${RUNNER_TEMP}/rendered-push.yaml"
            test -s "${RUNNER_TEMP}/rendered-push.yaml"
            while IFS= read -r metadata; do
              image="$(jq -er '.image' "${metadata}")"
              image_tag="$(jq -er '.tag' "${metadata}")"
              if ! grep -Fq "image: ${image}:${image_tag}" "${RUNNER_TEMP}/rendered-push.yaml"; then
                echo "::error::Rendered overlay lost ${image}:${image_tag} before push."
                return 1
              fi
            done < <(find "$GITHUB_WORKSPACE/image-metadata" -maxdepth 1 -name '*.json' -print | sort)
          }

          for attempt in 1 2 3; do
            git fetch --quiet origin "${GITOPS_BRANCH}"

            if ! git rebase "origin/${GITOPS_BRANCH}"; then
              git rebase --abort || true
              echo "::error::Concurrent GitOps changes conflict with this update; nothing was pushed."
              exit 1
            fi

            validate_rendered

            if git push origin "HEAD:${GITOPS_BRANCH}"; then
              echo "Pushed ${GITOPS_REPOSITORY}@${GITOPS_BRANCH} tag ${{ steps.images.outputs.tag }}."
              exit 0
            fi

            echo "Push rejected on attempt ${attempt}; re-reading remote state."
            sleep "$((attempt * 5))"
          done

          echo "::error::Could not push the GitOps update after 3 attempts; remote was not overwritten."
          exit 1
