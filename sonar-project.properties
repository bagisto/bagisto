# Lớp đầu: chưa tính test và coverage nên loại thư mục test khỏi phân tích.
# Khi thêm coverage sẽ khai báo sonar.tests và báo cáo coverage.
sonar.exclusions=**/vendor/**,**/node_modules/**,**/tests/**,**/publishable/**,**/public/**,**/storage/**,bootstrap/cache/**,**/*.min.js