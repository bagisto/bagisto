# Môi trường DEV local: app (php-fpm) + nginx + mysql + redis (+ elasticsearch tùy chọn) + mailpit
# Chạy:            docker compose up -d --build
# Kèm search:      docker compose --profile search up -d
# Lần đầu:         docker compose exec app composer install
#                  docker compose exec app php artisan bagisto:install
services:
  app:
    build:
      context: .
      target: dev
    volumes:
      - '.:/var/www/html'
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      SESSION_DRIVER: redis
      CACHE_STORE: redis    
      QUEUE_CONNECTION: redis
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [bagisto]

  nginx:
    image: nginx:alpine
    ports:
      - '${FORWARD_WEB_PORT:-8080}:80'
    volumes:
      - '.:/var/www/html:ro'
      - './docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro'
    depends_on: [app]
    networks: [bagisto]

  mysql:
    image: mysql:8.0
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'   # không được đặt là root
      MYSQL_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${DB_PASSWORD}']
      interval: 5s
      retries: 10
      timeout: 5s
    networks: [bagisto]

  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 5
      timeout: 3s
    networks: [bagisto]

  elasticsearch:
    profiles: ['search']
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.21
    ports:
      - '9200:9200'
    environment:
      - xpack.security.enabled=false   # chỉ dev
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks: [bagisto]

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
    networks: [bagisto]

networks:
  bagisto:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  es-data: