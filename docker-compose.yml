name: bagisto

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                VCS_REF: ${VCS_REF:-local}
                BUILD_DATE: ${BUILD_DATE:-unknown}
        image: bagisto-app:local
        init: true
        env_file:
            - .env
        volumes:
            - bagisto-storage:/var/www/html/storage/app/public
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 20s
        restart: unless-stopped

    worker:
        image: bagisto-app:local
        init: true
        command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=60", "--sleep=3", "--max-time=3600"]
        env_file:
            - .env
        volumes:
            - bagisto-storage:/var/www/html/storage/app/public
        depends_on:
            app:
                condition: service_healthy
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "php", "artisan", "queue:monitor", "redis:default", "--max=1000"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 20s
        stop_grace_period: 60s
        restart: unless-stopped

    scheduler:
        image: bagisto-app:local
        init: true
        command: ["php", "artisan", "schedule:work"]
        env_file:
            - .env
        volumes:
            - bagisto-storage:/var/www/html/storage/app/public
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "php", "artisan", "schedule:list"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 20s
        restart: unless-stopped

    nginx:
        build:
            context: .
            dockerfile: Dockerfile.nginx
            args:
                VCS_REF: ${VCS_REF:-local}
                BUILD_DATE: ${BUILD_DATE:-unknown}
        image: bagisto-web:local
        environment:
            PHP_FPM_HOST: ${PHP_FPM_HOST:-app:9000}
        ports:
            - "8080:80"
        volumes:
            - bagisto-storage:/var/www/html/storage/app/public:ro
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/install || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 20s
        restart: unless-stopped

    mysql:
        # TODO: pin by digest.
        image: mysql:8.0.46-bookworm
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
            MYSQL_DATABASE: ${DB_DATABASE:-bagisto}
            MYSQL_USER: ${DB_USERNAME:-bagisto}
            MYSQL_PASSWORD: ${DB_PASSWORD:-bagisto}
        volumes:
            - bagisto-mysql:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        restart: unless-stopped

    redis:
        # TODO: pin by digest.
        image: redis:8.8.4-alpine
        volumes:
            - bagisto-redis:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 6
        restart: unless-stopped

    elasticsearch:
        # TODO: pin by digest.
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.21
        profiles: ["search"]
        environment:
            - discovery.type=single-node
            - xpack.security.enabled=false
            - ES_JAVA_OPTS=-Xms256m -Xmx256m
        volumes:
            - bagisto-elasticsearch:/usr/share/elasticsearch/data
        ports:
            - "9200:9200"
        restart: unless-stopped

    mailpit:
        # TODO: pin by digest.
        image: axllent/mailpit:v1.33.1
        profiles: ["mail"]
        ports:
            - "1025:1025"
            - "8025:8025"
        restart: unless-stopped

volumes:
    bagisto-storage:
    bagisto-mysql:
    bagisto-redis:
    bagisto-elasticsearch:
